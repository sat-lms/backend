# 배포 서버용 프로파일. docker-compose.yml의 SPRING_PROFILES_ACTIVE 기본값이 prod입니다.
spring:
  jpa:
    # 소형 단일 호스트에서 쿼리 로그가 디스크를 잠식하지 않도록 운영에서는 끕니다.
    show-sql: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    root: INFO
    com.sat.lms: INFO
    org.hibernate.SQL: WARN

cors:
  # 프론트 도메인이 바뀌면 서버 .env의 CORS_ALLOWED_ORIGINS로 덮어쓸 수 있습니다.
  # 여러 개일 때는 콤마로 구분합니다. 로컬 오리진은 운영에서 허용하지 않습니다.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://satlms.vercel.app}
