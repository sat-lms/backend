# 로컬 개발용 프로파일. 프로파일 미지정 실행(IDE, ./gradlew bootRun)의 기본값입니다.
spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.sat.lms: DEBUG
    org.hibernate.SQL: DEBUG
    # 실행된 SQL의 바인딩 파라미터까지 확인합니다.
    org.hibernate.orm.jdbc.bind: TRACE

cors:
  allowed-origins:
    - http://localhost:5173
    - http://127.0.0.1:5173
    - https://satlms.vercel.app
