# 로컬 개발용 프로파일. ./gradlew bootRun이 build.gradle에서 이 프로파일을 활성화합니다.
# IDE에서 Gradle 위임 없이 실행한다면 실행 구성에 dev를 직접 지정해야 합니다.
spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.sat.lms: DEBUG
    org.hibernate.SQL: DEBUG
    # 실행된 SQL의 바인딩 파라미터까지 확인합니다.
    org.hibernate.orm.jdbc.bind: TRACE

cors:
  allowed-origins:
    - http://localhost:5173
    - http://127.0.0.1:5173
    - https://satlms.vercel.app
