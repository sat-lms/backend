spring:
  application:
    name: lms

  profiles:
    # 프로파일을 지정하지 않고 실행하면(IDE, ./gradlew bootRun) dev로 동작합니다.
    # 컨테이너 실행은 docker-compose.yml이 SPRING_PROFILES_ACTIVE로 prod를 넘기고,
    # 테스트는 build.gradle이 test 프로파일을 활성화합니다.
    default: dev

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

jwt:
  # 운영 환경에서는 반드시 충분히 긴 임의 문자열을 JWT_SECRET으로 주입하세요.
  secret: ${JWT_SECRET:local-development-secret-key-must-be-at-least-32-bytes}
  expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}

aws:
  region: ${AWS_REGION:ap-northeast-2}
  s3:
    bucket: ${AWS_S3_BUCKET:}
    presigned-expiration-minutes: ${AWS_S3_PRESIGNED_EXPIRATION_MINUTES:5}
