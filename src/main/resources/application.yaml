spring:
  application:
    name: lms

  # 기본 프로파일은 두지 않습니다. 프로파일을 명시하지 않고 기동하면 이 파일의
  # 공통 설정만 적용되어, 운영에 dev 설정(SQL 바인딩 로그 등)이 새는 일이 없습니다.
  # 각 실행 경로가 프로파일을 직접 선언합니다.
  #   컨테이너: Dockerfile의 ENV, docker-compose.yml의 SPRING_PROFILES_ACTIVE → prod
  #   ./gradlew bootRun: build.gradle의 bootRun 태스크 → dev
  #   테스트/CI: build.gradle의 test 태스크 → test

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

jwt:
  # 운영 환경에서는 반드시 충분히 긴 임의 문자열을 JWT_SECRET으로 주입하세요.
  secret: ${JWT_SECRET}
  expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}

aws:
  region: ${AWS_REGION:ap-northeast-2}
  s3:
    bucket: ${AWS_S3_BUCKET:}
    presigned-expiration-minutes: ${AWS_S3_PRESIGNED_EXPIRATION_MINUTES:5}

rate-limit:
  auth:
    login:
      capacity: ${AUTH_LOGIN_RATE_LIMIT_CAPACITY:10}
      period: ${AUTH_LOGIN_RATE_LIMIT_PERIOD:1m}
    signup:
      capacity: ${AUTH_SIGNUP_RATE_LIMIT_CAPACITY:5}
      period: ${AUTH_SIGNUP_RATE_LIMIT_PERIOD:1h}
    cache:
      maximum-size: ${AUTH_RATE_LIMIT_CACHE_MAXIMUM_SIZE:10000}
      expire-after-access: ${AUTH_RATE_LIMIT_CACHE_EXPIRE_AFTER_ACCESS:2h}
