name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - dev
    types:
      - completed

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            cd ~/backend
            git pull origin dev
            echo "배포 대상 커밋: $(git rev-parse HEAD)"
            docker compose up -d --build app

            sleep 5
            docker compose ps app | grep -q "Up" || (echo "배포 실패: app 컨테이너가 정상 기동되지 않았습니다" && exit 1)

            i=1
            until curl -sf http://localhost:8080/v3/api-docs > /dev/null; do
              if [ "$i" -ge 10 ]; then
                echo "헬스체크 실패: app이 정상 응답하지 않습니다"
                exit 1
              fi
              i=$((i + 1))
              sleep 3
            done
            echo "헬스체크 성공"