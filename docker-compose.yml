services:
  postgres:
    image: postgres:16
    container_name: team-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # 호스트에 포트를 노출하지 않습니다. app 컨테이너는 같은 Docker 네트워크에서
    # postgres:5432로 접근하므로 호스트 포트가 필요 없고, Docker는 iptables를
    # 직접 조작해 ufw 규칙을 우회할 수 있어 127.0.0.1 바인딩조차 SSH로 서버에
    # 접근 가능한 사람에게는 열려 있는 것과 같습니다. DB 확인은 DEPLOYMENT.md의
    # 안내대로 `docker exec -it team-postgres psql -U ... -d ...`를 사용하세요.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Lightsail 2GB RAM 인스턴스에서 app(768m)+postgres(512m)+caddy(128m)=1408m를 쓰고 나머지
    # ~640m를 OS/sshd/docker daemon용으로 남긴다(#82, #126). postgres는 회원 수가 적은
    # 소형 LMS라 512m로 충분하고, 필요해지면 이 값만 올리면 된다.
    mem_limit: 512m
    # 로그가 postgres 데이터 볼륨과 같은 디스크에 무한히 쌓여 디스크 고갈로 DB까지
    # 함께 죽는 걸 막는다. 서비스당 최대 30MB(10m x 3)로 제한한다.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build: .
    container_name: lms-app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # 컨테이너로 띄우는 경우는 배포 형태로 간주해 기본 프로파일을 prod로 둡니다.
      # 서버 .env에 값을 넣는 걸 잊어도 운영이 dev 설정으로 기동되지 않습니다.
      # 로컬에서 컨테이너를 dev 설정으로 띄우려면 .env에 SPRING_PROFILES_ACTIVE=dev를 넣으세요.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      # .env의 DB_URL(localhost 기준)은 로컬에서 애플리케이션을 직접 실행할 때만
      # 쓰입니다. 이 app 컨테이너 안에서는 localhost가 postgres가 아니라 이
      # 컨테이너 자신을 가리키므로, 여기서는 항상 서비스명 postgres로 재구성해서
      # 넘깁니다.
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-3600}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_S3_PRESIGNED_EXPIRATION_MINUTES: ${AWS_S3_PRESIGNED_EXPIRATION_MINUTES:-5}
      # 프론트 오리진 허용 목록(콤마 구분). 서버 .env의 CORS_ALLOWED_ORIGINS로 덮어씁니다.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://satlms.cloud,https://www.satlms.cloud,https://satlms.vercel.app}
      # (Temurin 17 기준) JVM은 기본적으로 cgroup 메모리 한도를 인지하지만,
      # 힙이 컨테이너 예산을 과도하게 잠식하지 않도록 상한을 명시한다(mem_limit, 바로 아래).
      # 힙을 컨테이너 한도의 75%로 잡아 나머지 25%를 메타스페이스/스레드 스택/다이렉트 버퍼용으로 남긴다.
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
    # postgres, caddy와 합쳐 1408m로 2GB 인스턴스에 ~640m 여유를 남긴다(계산 근거는 위 postgres
    # mem_limit 주석 참고).
    mem_limit: 768m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # ports: 8080 외부 노출 제거. Caddy가 같은 Docker 네트워크에서 app:8080으로 접근한다.

  # HTTPS 종료와 리버스 프록시. 인증서는 Caddy가 Let's Encrypt로 자동 발급·갱신하고
  # caddy_data 볼륨에 보관하므로, 컨테이너를 재생성해도 재발급하지 않는다.
  # Caddyfile 수정 후에는 `docker exec lms-caddy caddy reload --config /etc/caddy/Caddyfile`로 반영한다.
  caddy:
    image: caddy:2-alpine
    container_name: lms-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    # 정적 파일 없이 리버스 프록시만 하므로 128m면 충분하다(메모리 예산은 postgres mem_limit 주석 참고).
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
  caddy_data:
  caddy_config:
